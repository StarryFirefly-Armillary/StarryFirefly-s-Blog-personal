{% extends "base.html" %}
{% block title %}修改密码 - 繁星绘流萤{% endblock %}
{% block content %}
<div class="admin-container">
    <h2>修改密码</h2>
    <form method="POST" class="admin-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>旧密码</label>
        <input type="password" name="old_password" class="input" required>

        <label>新密码</label>
        <input type="password" name="new_password" class="input" required minlength="6">

        <label>确认新密码</label>
        <input type="password" name="new_password2" class="input" required minlength="6">

        <button type="submit" class="btn">修改密码</button>
    </form>
    <p class="back-link"><a href="{{ url_for('index') }}">← 返回首页</a></p>
</div>
{% endblock %}
