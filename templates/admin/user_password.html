{% extends "base.html" %}
{% block title %}修改密码 - {{ user.username }}{% endblock %}
{% block content %}
<div class="admin-container">
    <h2>修改用户密码</h2>
    <div class="admin-form">
        <p style="margin-bottom:16px;color:var(--text-secondary);">
            用户: <strong>{{ user.username }}</strong>
            {% if user.role == 'admin' %}<span class="status-used">管理员</span>{% endif %}
        </p>
        <form method="POST" autocomplete="off">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label>新密码</label>
            <input type="password" name="new_password" class="input" required minlength="6" autocomplete="new-password">
            <label>确认新密码</label>
            <input type="password" name="new_password2" class="input" required minlength="6" autocomplete="new-password">
            <button type="submit" class="btn">修改密码</button>
        </form>
    </div>
    <p class="back-link"><a href="{{ url_for('admin_users') }}">← 返回用户管理</a></p>
</div>
{% endblock %}
