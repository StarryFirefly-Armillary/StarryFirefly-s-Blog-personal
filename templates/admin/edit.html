{% extends "base.html" %}
{% block title %}{% if article %}编辑文章{% else %}新建文章{% endif %}{% endblock %}
{% block content %}
<div class="admin-container" style="max-width: 900px;">
    <h2>{% if article %}编辑文章{% else %}新建文章{% endif %}</h2>
    <form method="POST" id="article-form" class="admin-form" onsubmit="return prepareSubmit();">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
            <div style="width:160px;">
                <label>文章ID {% if article %}(当前: {{ article.id }}){% endif %}</label>
                <input type="number" name="article_id" class="input" value="{{ article.id if article else '' }}" min="1" placeholder="留空自动分配">
            </div>
            <p style="margin-bottom:12px;color:var(--text-secondary);font-size:0.78rem;">新建时留空自动填补最小空缺ID</p>
        </div>

        <label>标题</label>
        <input type="text" name="title" class="input" value="{{ article.title if article else '' }}" required autofocus>

        <label>摘要</label>
        <input type="text" name="summary" class="input" value="{{ article.summary if article else '' }}" maxlength="200">

        <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
            <div style="flex:1;min-width:200px;">
                <label>发布时间</label>
                <input type="datetime-local" name="created_at" class="input" value="{% if article and article.created_at %}{{ article.created_at[:16].replace(' ', 'T') }}{% endif %}" step="1">
            </div>
            <p style="margin-bottom:12px;color:var(--text-secondary);font-size:0.78rem;">留空则自动设为当前时间</p>
        </div>

        <label>内容</label>

        <div class="upload-area">
            <div class="upload-row">
                <div class="file-input-wrap" style="flex:1;min-width:0;">
                    <input type="file" id="image-file" accept="image/*" onchange="updateFileName(this)">
                    <label for="image-file" class="file-input-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                        选择图片
                    </label>
                    <span class="file-input-name" id="image-file-name">未选择文件</span>
                </div>
                <button type="button" id="upload-btn" class="btn btn-secondary" style="white-space:nowrap;">上传图片</button>
            </div>
            <div class="upload-row" style="margin-top:8px;">
                <input type="text" id="image-url" class="input" placeholder="或直接粘贴图片 URL..." style="margin-bottom:0;">
                <button type="button" id="insert-url-btn" class="btn btn-secondary" style="white-space:nowrap;">插入图片</button>
            </div>
            <div class="upload-row" style="margin-top:8px;">
                <div class="file-input-wrap" style="flex:1;min-width:0;">
                    <input type="file" id="video-file" accept="video/*" onchange="updateFileName(this)">
                    <label for="video-file" class="file-input-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        选择视频
                    </label>
                    <span class="file-input-name" id="video-file-name">未选择文件</span>
                </div>
                <button type="button" id="video-upload-btn" class="btn btn-secondary" style="white-space:nowrap;">上传视频</button>
            </div>
            <div class="upload-row" style="margin-top:8px;gap:8px;">
                <button type="button" id="media-btn" class="btn btn-secondary" style="white-space:nowrap;">📷 媒体库</button>
                <button type="button" id="attach-lib-btn" class="btn btn-secondary" style="white-space:nowrap;">📎 附件库</button>
            </div>
            <div class="upload-row" style="margin-top:8px;">
                <div class="file-input-wrap" style="flex:1;min-width:0;">
                    <input type="file" id="attach-file" onchange="updateFileName(this)">
                    <label for="attach-file" class="file-input-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                        选择附件
                    </label>
                    <span class="file-input-name" id="attach-file-name">未选择文件</span>
                </div>
                <button type="button" id="attach-upload-btn" class="btn btn-secondary" style="white-space:nowrap;">上传附件</button>
            </div>
            <p id="upload-status" class="upload-status"></p>
        </div>

        <div id="media-modal" class="media-modal" style="display:none;">
            <div class="media-modal-bg" onclick="document.getElementById('media-modal').style.display='none'"></div>
            <div class="media-modal-body">
                <div class="media-modal-header">
                    <h4 id="media-modal-title">媒体库</h4>
                    <button type="button" class="media-close" onclick="document.getElementById('media-modal').style.display='none'">&times;</button>
                </div>
                <div id="media-grid" class="media-grid">加载中...</div>
            </div>
        </div>

        <div id="editor-container" class="quill-editor"></div>
        <textarea name="content" id="content-hidden" style="display:none;">{{ article.content if article else '' }}</textarea>

        <button type="submit" class="btn" style="margin-top:16px;">{% if article %}保存修改{% else %}发布文章{% endif %}</button>
    </form>
    <p class="back-link"><a href="{{ url_for('admin_dashboard') }}">← 返回后台</a></p>
</div>

/* --- 自定义颜色按钮 --- */

/* --- 内置调色盘 --- */

    box-shadow: 0 4px 16px rgba(0,0,0,0.15); padding: 10px;
    width: 220px; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 4px;
}
.color-palette.show { display: block; }
.color-palette .color-row { display: flex; gap: 4px; margin-bottom: 4px; justify-content: center; }
.color-palette .color-swatch {
    width: 22px; height: 22px; border-radius: 3px; border: 1px solid #ddd;
    cursor: pointer; flex-shrink: 0; transition: transform 0.12s;
}
.color-palette .color-swatch:hover { transform: scale(1.25); border-color: #3b82f6; z-index: 1; }
.color-palette .color-swatch.swatch-white { border-color: #ccc; }
.color-palette .color-custom-btn {
    display: block; width: 100%; margin-top: 6px; padding: 4px 0;
    border: 1px dashed #ccc; border-radius: 4px; background: #fafafa;
    cursor: pointer; font-size: 11px; color: #666; text-align: center;

.color-palette .color-custom-btn:hover { background: #f0f0f0; border-color: #999; }

<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>

<script>
var CSRF_TOKEN = '{{ csrf_token }}';

function prepareSubmit() {
    var html = quill.root.innerHTML;
    html = html.replace(/▶VIDEO:(\/static\/uploads\/[a-zA-Z0-9_.-]+)/g,
        '<video src="$1" controls style="max-width:100%;border-radius:6px;display:block;"></video>');
    document.getElementById('content-hidden').value = html;
    return true;
}

// 解除字号白名单限制，允许自定义 px 值
var SizeStyle = Quill.import('attributors/style/size');
SizeStyle.whitelist = null;
Quill.register(SizeStyle, true);

// 扩展字体白名单，支持中文字体
var Font = Quill.import('formats/font');
Font.whitelist = ['', 'yahei', 'songti', 'kaiti', 'fangsong', 'arial', 'serif', 'monospace'];
Quill.register(Font, true);

// 解除代码块格式化限制，将 format/formats/allowedChildren/optimize 重置为普通 Block 的行为
var CodeBlock = Quill.import('formats/code-block');
var BlockBlot = Quill.import('blots/block');
if (CodeBlock && BlockBlot) {
    CodeBlock.formats = BlockBlot.formats;
    CodeBlock.allowedChildren = BlockBlot.allowedChildren;
    CodeBlock.prototype.format = BlockBlot.prototype.format;
    CodeBlock.prototype.formatAt = BlockBlot.prototype.formatAt;
    CodeBlock.prototype.optimize = BlockBlot.prototype.optimize;
}

var quill = new Quill('#editor-container', {
    theme: 'snow',
    placeholder: '开始写作...',
    modules: {
        toolbar: [
            [{ 'header': [1, 2, 3, false] }],
            [{ 'font': [false, 'yahei', 'songti', 'kaiti', 'fangsong', 'arial', 'serif', 'monospace'] }],
            [{ 'size': ['12px', '14px', '16px', '18px', '20px', '24px', '28px', '32px', '40px', '48px', false] }],
            ['bold', 'italic', 'underline', 'strike'],
            [{ 'align': [] }],
            [{ 'list': 'ordered' }, { 'list': 'bullet' }],
            ['blockquote', 'code-block'],
            ['link'],
            ['clean']
        ]
    }
});

// --- 汉化工具栏 ---
setTimeout(function() {
    var t = document.querySelector('.ql-toolbar');
    if (!t) return;

    var tip = {
        'ql-bold':'加粗 Ctrl+B', 'ql-italic':'斜体 Ctrl+I', 'ql-underline':'下划线 Ctrl+U',
        'ql-strike':'删除线', 'ql-blockquote':'引用', 'ql-code-block':'代码块',
        'ql-link':'插入链接', 'ql-image':'插入图片', 'ql-clean':'清除格式'
    };
    t.querySelectorAll('button').forEach(function(b) {
        for (var k in tip) { if (b.classList.contains(k)) { b.title = tip[k]; break; } }
    });

    // 段落格式
    var hp = t.querySelector('.ql-header');
    if (hp) hp.querySelector('.ql-picker-label').title = '段落格式';
    // 字体

    var customBtn = document.createElement('span');
    customBtn.className = 'color-custom-btn';

    // 十六进制颜色输入
    var hexRow = document.createElement('div');
    hexRow.className = 'color-row color-hex-row';
    var hexInput = document.createElement('input');
    hexInput.type = 'text';
    hexInput.placeholder = '#十六进制';
    hexInput.className = 'color-hex-input';
    hexInput.maxLength = 7;
    hexInput.title = '输入颜色代码后按回车或点击右侧应用';
    var hexLastApply = 0;
    function applyHex(e) {
        var now = Date.now();
        if (now - hexLastApply < 300) return;
        hexLastApply = now;
        if (e) { e.preventDefault(); e.stopPropagation(); }
        var raw = hexInput.value.trim();
        if (raw.length > 0 && raw[0] !== '#') raw = '#' + raw;
        if (/^#[0-9a-fA-F]{6}$/.test(raw)) {
            if (savedRange) {
                quill.formatText(savedRange.index, savedRange.length, paletteType, raw.toUpperCase());
                savedRange = null;
            }
            hexInput.value = '';
            paletteEl.classList.remove('show');
            activeBtn = null;
        } else {
            hexInput.style.borderColor = '#dc2626';
            setTimeout(function() { hexInput.style.borderColor = ''; }, 600);
        }

    function captureAndApplyHex(e) {
        e.preventDefault();
        e.stopPropagation();
        saveSelection();
        applyHex(e);
    }
    hexInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); saveSelection(); applyHex(e); }
        if (e.key === 'Escape') { hexInput.value = ''; paletteEl.classList.remove('show'); activeBtn = null; }
    });
    hexInput.addEventListener('pointerdown', function(e) { e.stopPropagation(); saveSelection(); });
    hexInput.addEventListener('touchstart', function(e) { e.stopPropagation(); saveSelection(); });
    hexInput.addEventListener('mousedown', function(e) { e.stopPropagation(); saveSelection(); });

    var paletteType = 'color';
    var activeBtn = null;

    function togglePalette(btn, typeName) {
        saveSelection();
        if (paletteEl.classList.contains('show') && activeBtn === btn) {
            paletteEl.classList.remove('show');
            activeBtn = null;
            return;
        }
        paletteType = typeName;
        activeBtn = btn;
        var rect = btn.getBoundingClientRect();
        paletteEl.style.top = (rect.bottom + window.scrollY + 4) + 'px';
        paletteEl.style.left = (rect.left + window.scrollX + rect.width / 2) + 'px';
        paletteEl.classList.add('show');
    }

    function createColorBtn(typeName, iconSVG, title) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'ql-color-btn';
        btn.title = title;
        btn.innerHTML = iconSVG;
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            togglePalette(btn, typeName);
        });
        // 手机 touchstart 先触发并阻止后续 click，避免重复 toggle
        btn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            togglePalette(btn, typeName);
        });
        return btn;
    }

    document.addEventListener('click', function(e) {
        if (paletteEl.classList.contains('show') &&

    // --- 保存选区，防止点击输入框/工具栏按钮时丢失 ---
    var savedRange = null;
    quill.on('selection-change', function(range) {
        if (range && range.length > 0) savedRange = range;
    });

    // 兜底：用原生 Selection API 获取选区（vivo 等定制浏览器 Quill 可能拿不到）
    function getNativeRange() {
        var sel = quill.getSelection();
        if (sel && sel.length > 0) return sel;
        var ns = window.getSelection();
        if (!ns || ns.rangeCount === 0 || ns.isCollapsed) return null;
        var r = ns.getRangeAt(0);
        if (!quill.root.contains(r.commonAncestorContainer)) return null;
        try {
            var start = quill.getIndex(r.startContainer, r.startOffset);
            return { index: start, length: r.toString().length };
        } catch(e) { return null; }
    }

    function saveSelection() {
        var r = getNativeRange();
        if (r) savedRange = r;
    }

    // 拦截 format()，手机端选区丢失时自动用保存的选区
    var _origFormat = quill.format.bind(quill);
    quill.format = function(name, value, source) {
        if (!getNativeRange() && savedRange) {
            quill.formatText(savedRange.index, savedRange.length, name, value, source || 'user');
            savedRange = null;
            return;
        }
        return _origFormat(name, value, source);
    };

    // --- 自定义字号输入框 ---
    var sizePicker = t.querySelector('.ql-size');
    if (sizePicker) {
        var wrap = document.createElement('span');
        wrap.className = 'ql-custom-size';
        var inp = document.createElement('input');
        inp.type = 'number'; inp.placeholder = 'px'; inp.min = 8; inp.max = 200;
        inp.title = '输入字号后点击右侧按钮应用';
        var btn = document.createElement('button');
        btn.type = 'button'; btn.title = '应用自定义字号';
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>';
        var lastApply = 0;
        function applySize() {
            var now = Date.now();
            if (now - lastApply < 300) return;
            lastApply = now;
            var v = parseInt(inp.value);
            if (v && v >= 8 && v <= 200) {
                // 在 handler 中已经捕获了选区，这里直接用 savedRange
                if (savedRange) {
                    quill.formatText(savedRange.index, savedRange.length, 'size', v + 'px');
                    savedRange = null;
                }
                inp.value = '';
            }
        }
        function captureAndApply(e) {
            e.preventDefault();
            saveSelection();
            applySize();
        }
        btn.addEventListener('pointerdown', captureAndApply);
        btn.addEventListener('touchstart', captureAndApply);
        btn.addEventListener('mousedown', captureAndApply);
        // 输入框：在失焦前保存选区
        inp.addEventListener('pointerdown', function(e) { saveSelection(); });
        inp.addEventListener('touchstart', function(e) { e.stopPropagation(); saveSelection(); });
        inp.addEventListener('mousedown', function(e) { saveSelection(); });
        inp.addEventListener('focus', function(e) { saveSelection(); });
        inp.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); captureAndApply(e); } });
        wrap.appendChild(inp);
        wrap.appendChild(btn);
        sizePicker.parentNode.insertBefore(wrap, sizePicker.nextSibling);
    }
}, 50);

// Image upload
document.getElementById('upload-btn').addEventListener('click', function() {
    var fileInput = document.getElementById('image-file');
    var file = fileInput.files[0];
    var status = document.getElementById('upload-status');
    if (!file) { status.textContent = '请先选择图片文件'; return; }
    status.textContent = '上传中...';
    status.style.color = '';
    var formData = new FormData();
    formData.append('file', file);
    formData.append('csrf_token', CSRF_TOKEN);
    fetch('{{ url_for("admin_upload") }}', {
        method: 'POST',
        body: formData,
        credentials: 'same-origin'
    })
    .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status + ' - 请确认已登录后台');
        return r.json();
    })
    .then(function(data) {
        if (data.ok) {
            var range = quill.getSelection(true);
            quill.insertEmbed(range.index, 'image', data.url);
            quill.setSelection(range.index + 1);
            status.textContent = '上传成功！';
            status.style.color = '#16a34a';
        } else {
            status.textContent = '上传失败: ' + data.error;
            status.style.color = '#dc2626';
        }
    })
    .catch(function(e) {
        status.textContent = e.message || '上传失败，请重试';
        status.style.color = '#dc2626';
    });
});

// Media library (images)
var mediaModal = document.getElementById('media-modal');
var mediaGrid = document.getElementById('media-grid');

document.getElementById('media-btn').addEventListener('click', function() {
    mediaModal.style.display = 'block';
    document.getElementById('media-modal-title').textContent = '媒体库';
    mediaGrid.className = 'media-grid';
    if (mediaGrid.dataset.loaded) return;
    fetch('{{ url_for("admin_images_list") }}', { credentials: 'same-origin' })
        .then(function(r) { return r.json(); })
        .then(function(imgs) {
            mediaGrid.innerHTML = '';
            if (imgs.length === 0) {
                mediaGrid.innerHTML = '<p style="color:var(--text-secondary);text-align:center;padding:40px;">暂无媒体文件</p>';
                return;
            }
            mediaGrid.dataset.loaded = '1';
            imgs.forEach(function(img) {
                var el = document.createElement('div');
                el.className = 'media-item';
                if (img.is_video) {
                    if (img.thumb_url && img.thumb_url !== img.url) {
                        el.style.backgroundImage = 'url(' + img.thumb_url + ')';
                        el.style.backgroundSize = 'cover';
                        el.style.backgroundPosition = 'center';
                    } else {
                        el.style.backgroundColor = '#1e293b';
                    }
                    el.innerHTML = '<div class="media-video-icon">' +
                        '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2">' +
                        '<polygon points="5 3 19 12 5 21 5 3" fill="#94a3b8" stroke="none"/></svg>' +
                        '</div><span class="media-type-badge">视频</span>';
                } else {
                    el.innerHTML = '<img src="' + img.url + '" loading="lazy" title="' + img.name + '">';
                }
                el.onclick = function() {
                    var range = quill.getSelection(true);
                    if (img.is_video) {
                        quill.insertText(range.index, '\n▶VIDEO:' + img.url + '\n', { bold: true });
                        quill.setSelection(range.index + 1);
                    } else {
                        quill.insertEmbed(range.index, 'image', img.url);
                        quill.setSelection(range.index + 1);
                    }
                    mediaModal.style.display = 'none';
                };
                mediaGrid.appendChild(el);
            });
            // Client-side video thumbnail generation for videos without server thumbnails
            imgs.forEach(function(img, i) {
                if (img.is_video && (!img.thumb_url || img.thumb_url === img.url)) {
                    var el = mediaGrid.children[i];
                    if (!el) return;
                    var video = document.createElement('video');
                    video.preload = 'metadata';
                    video.muted = true;
                    video.playsInline = true;
                    video.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;';
                    document.body.appendChild(video);
                    video.src = img.url;
                    var done = false;
                    video.onloadedmetadata = function() {
                        if (!done && video.duration) {
                            video.currentTime = Math.min(1, video.duration * 0.1);
                        }
                    };
                    video.onseeked = function() {
                        if (done) return;
                        done = true;
                        try {
                            var canvas = document.createElement('canvas');
                            canvas.width = 360;
                            canvas.height = Math.floor(canvas.width / video.videoWidth * video.videoHeight) || 200;
                            var ctx = canvas.getContext('2d');
                            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                            el.style.backgroundImage = 'url(' + canvas.toDataURL('image/jpeg', 0.7) + ')';
                            el.style.backgroundSize = 'cover';
                            el.style.backgroundPosition = 'center';
                            el.style.backgroundColor = 'transparent';
                        } catch(e) {}
                        document.body.removeChild(video);
                    };
                    video.onerror = function() { document.body.removeChild(video); };
                    setTimeout(function() { if (!done) { done = true; document.body.contains(video) && document.body.removeChild(video); } }, 8000);
                }
            });
        })
        .catch(function() {
            mediaGrid.innerHTML = '<p style="color:var(--danger);text-align:center;">加载失败</p>';
        });
});

                el.onclick = function() {
                    var range = quill.getSelection(true);
                    quill.insertText(range.index, '[[attachment:' + item.url + '::' + item.name + '::' + ']]\n');
                    quill.setSelection(range.index + 1);
                    mediaModal.style.display = 'none';
                };
                mediaGrid.appendChild(el);
            });
        })
        .catch(function() {
            mediaGrid.innerHTML = '<p style="color:var(--danger);text-align:center;">加载失败</p>';
        });
});

    // --- Image resize toolbar ---
    var sizeBar = document.createElement('div');
    sizeBar.className = 'img-size-bar';
    sizeBar.innerHTML =
        '<button type="button" data-w="200">小</button>' +
        '<button type="button" data-w="400">中</button>' +
        '<button type="button" data-w="600">大</button>' +
        '<button type="button" data-w="100%">全宽</button>' +
        '<span class="img-size-sep"></span>' +
        '<input type="number" class="img-size-input" placeholder="px" min="20" max="2000">' +
        '<button type="button" data-apply="1">确定</button>';
    document.body.appendChild(sizeBar);

    var currentImg = null;

    function applySize(img, val) {
        if (val === '100%') {
            img.removeAttribute('width');
            img.style.width = '100%';
            img.style.height = 'auto';
        } else {
            img.setAttribute('width', val);
            img.style.width = val + 'px';
            img.style.height = 'auto';
        }
    }

    function hideBar() {
        sizeBar.classList.remove('show');
        currentImg = null;
    }

    quill.root.addEventListener('click', function(e) {
        if (e.target.tagName === 'IMG') {
            e.stopPropagation();
            currentImg = e.target;
            var ir = currentImg.getBoundingClientRect();
            var top = ir.top - 44;
            if (top < 10) top = ir.bottom + 8;
            var left = ir.left + ir.width / 2 - 146;
            if (left < 8) left = 8;
            if (left + 300 > window.innerWidth) left = window.innerWidth - 308;
            sizeBar.style.top = top + 'px';
            sizeBar.style.left = left + 'px';
            sizeBar.classList.add('show');
        } else if (!e.target.closest('.img-size-bar')) {
            hideBar();
        }
    });

    sizeBar.addEventListener('click', function(e) {
        if (!currentImg) return;
        e.stopPropagation();
        var w = e.target.getAttribute('data-w');
        if (w) {
            applySize(currentImg, w);
            sizeBar.classList.remove('show');
            currentImg = null;
            return;
        }
        if (e.target.getAttribute('data-apply')) {
            var input = sizeBar.querySelector('.img-size-input');
            var px = parseInt(input.value);
            if (px && px >= 20) {
                applySize(currentImg, px);
                input.value = '';
                sizeBar.classList.remove('show');
                currentImg = null;
            }
            return;
        }
    });

    // --- 未保存离开提示 ---
    var editDirty = false;
    function markDirty() { editDirty = true; }
    quill.on('text-change', markDirty);
    document.querySelectorAll('#article-form input, #article-form textarea').forEach(function(el) {
        el.addEventListener('input', markDirty);
        el.addEventListener('change', markDirty);
    });
    window.addEventListener('beforeunload', function(e) {
        if (editDirty) {
            e.preventDefault();
            e.returnValue = '';
        }
    });
    document.getElementById('article-form').addEventListener('submit', function() {
        editDirty = false;
    });
</script>
{% endblock %}
